name: CI-CD-Pipeline

on:
  push:
    branches:
      - main
  pull_request:

env:
  DOCKER_IMAGE: naveenkumarvelanati/python-argo
  DOCKER_TAG: latest

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Checkout Code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2️⃣ Set up Java (required for Sonar Scanner)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # 3️⃣ SonarQube Scan
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v2
      env:
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # 4️⃣ SonarQube Quality Gate
    - name: SonarQube Quality Gate
      uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
      timeout-minutes: 2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # 5️⃣ Docker Build
    - name: Build Docker Image
      run: |
        docker build -t $DOCKER_IMAGE:$DOCKER_TAG ./app

    # 6️⃣ Trivy Image Scan
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
        severity: HIGH,CRITICAL
        exit-code: '0'

    # 7️⃣ DockerHub Login
    - name: DockerHub Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 8️⃣ Push Docker Image
    - name: Push Docker Image
      run: |
        docker push $DOCKER_IMAGE:$DOCKER_TAG

    # 9️⃣ Cleanup
    - name: Cleanup
      run: |
        docker rmi $DOCKER_IMAGE:$DOCKER_TAG || true
